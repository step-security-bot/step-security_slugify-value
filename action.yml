name: Slugify Value
author: step-security
description: Github Action to slugify a value
inputs:
  key:
    description: Environment variable that will hold the value and serve as prefix to slugified value
    required: true
  prefix:
    description: Value to prepend to each generated variable
    required: false
    default: ""
  publish-env:
    description: Publish slugs as environment variables
    required: true
    default: "true"
  slug-maxlength:
    description: Max length of the slugified values
    required: true
    default: "63"
  value:
    description: Value to slugify
    required: false
outputs:
  slug:
    description: Value Slug
    value: ${{ steps.slugify.outputs.slug }}
  slug-cs:
    description: Value Slug (Case-sensitive)
    value: ${{ steps.slugify.outputs.slug-cs }}
  slug-url:
    description: Value Slug URL
    value: ${{ steps.slugify.outputs.slug-url }}
  slug-url-cs:
    description: Value Slug URL (Case-sensitive)
    value: ${{ steps.slugify.outputs.slug-url-cs }}
  value:
    description: The value to be slugify
    value: ${{ steps.slugify.outputs.value }}
runs:
  using: composite
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        # validate subscription status
        UPSTREAM="rlespinasse/slugify-value"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash
    - env:
        INPUT_KEY: ${{ inputs.key }}
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_PUBLISH_ENV: ${{ inputs.publish-env }}
        INPUT_SLUG_MAXLENGTH: ${{ inputs.slug-maxlength }}
        INPUT_VALUE: ${{ inputs.value }}
      id: slugify
      run: $GITHUB_ACTION_PATH/slugify.sh
      shell: bash
branding:
  icon: crop
  color: gray-dark
